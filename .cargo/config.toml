[alias]
test-document-backend = "test --manifest-path omega-hpc/Cargo.toml -p omega-hpc-document --color never"
test-document-backend-main = "test -p omega-context --features omega-context/document-backend --color never"
test-document-commands = "test -p omega-session --features document-backend spawn_command_document --lib --color never -- --test-threads=1"